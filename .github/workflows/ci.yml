name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Docker is available on the Ubuntu runner, so the Testcontainers
      # integration test (ReservationConcurrencyIT) runs here for real
      # instead of disabling itself.
      - name: Build and test
        run: mvn -B verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps: npm 10's peer resolver fails on the vitest
      # dependency graph scaffolded by Angular 21.
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --configuration production
