# ---------------------------------------------------------------------------
# auth-service
#
# Every value that is a secret is read from the environment and has NO default:
# a missing secret must stop the service at startup, not silently fall back to
# something predictable.
# ---------------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never

spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USER:auth_user}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    # The schema belongs to Flyway. `validate` makes Hibernate check that the
    # mapping matches the migrated tables and fail fast when it does not.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: auth
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
    create-schemas: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

security:
  jwt:
    issuer: ${JWT_ISSUER:logistics-auth}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
    key-id: ${JWT_KEY_ID:logistics-auth-key}
    # Empty means "generate an ephemeral key pair at startup" - development only.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}

  service-clients:
    order-service:
      secret: ${ORDER_SERVICE_CLIENT_SECRET:}
      roles:
        - ROLE_SERVICE

  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logistics:
  cleanup:
    refresh-tokens-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.logistics.auth: ${LOG_LEVEL:INFO}
    # Never raise these two above INFO outside a debugging session: they can
    # print tokens and SQL parameters.
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
