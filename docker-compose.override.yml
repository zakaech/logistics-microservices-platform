# ---------------------------------------------------------------------------
# Développement local uniquement. Docker Compose fusionne ce fichier automatiquement :
# `docker compose up` le prend en compte, tandis que
# `docker compose -f docker-compose.yml up` l'ignore.
#
# Il publie des ports que la topologie de production garde internes, afin de pouvoir
# atteindre une base avec un client SQL ou interroger un service directement pendant
# le débogage.
# ---------------------------------------------------------------------------
services:

  postgres:
    ports:
      - "5432:5432"

  mongodb:
    ports:
      - "27017:27017"

  # Chaque service expose son propre document OpenAPI et son Swagger UI. Publier les
  # ports ici plutôt que dans docker-compose.yml préserve la topologie de production
  # - seuls la gateway et le frontend y sont joignables - tout en rendant la
  # documentation d'API de chaque service consultable pendant le développement.
  auth-service:
    ports:
      - "8081:8081"
    environment:
      LOG_LEVEL: DEBUG

  catalog-service:
    ports:
      - "8082:8082"
    environment:
      LOG_LEVEL: DEBUG

  inventory-service:
    ports:
      - "8083:8083"
    environment:
      LOG_LEVEL: DEBUG

  order-service:
    ports:
      - "8084:8084"
    environment:
      LOG_LEVEL: DEBUG
