# ---------------------------------------------------------------------------
# Serves the built Angular app and proxies the API to the gateway.
#
# The proxy is what makes the production path same-origin: the browser only ever
# talks to this server, so there is no cross-origin request, no preflight, and no
# list of allowed origins to keep in step with a deployment.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles are immutable: their name changes whenever their content does,
    # so they can be cached indefinitely.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached: it is what points at the current bundle names,
    # so a stale copy would keep loading a deployment that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Placing an order calls three services in turn; the default 60s is enough,
        # but stating it makes the budget explicit rather than inherited.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Client-side routing: any unknown path is an Angular route, not a missing file.
    # Without this, reloading /orders/123 would return 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
